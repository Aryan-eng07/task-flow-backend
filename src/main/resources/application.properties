spring.application.name=task-flow-backend

spring.datasource.url=jdbc:mysql://localhost:3306/taskflow
spring.datasource.username=root
spring.datasource.password=Aryan2004@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Stateless JWT auth: no default in-memory user
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.flyway.enabled=false

# JWT (override the secret in every real environment; must be >= 32 chars for HS256)
taskflow.jwt.secret=${TASKFLOW_JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
taskflow.jwt.access-token-ttl=15m
taskflow.jwt.refresh-token-ttl=7d

