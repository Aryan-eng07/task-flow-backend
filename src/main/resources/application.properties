spring.application.name=task-flow-backend

# --- Datasource (override via SPRING_DATASOURCE_* env in Docker) ---
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Aryan2004@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Stateless JWT auth: no default in-memory user
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- JWT (override the secret in every real environment; must be >= 32 chars for HS256) ---
taskflow.jwt.secret=${TASKFLOW_JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
taskflow.jwt.access-token-ttl=15m
taskflow.jwt.refresh-token-ttl=7d

# --- Assignment engine (live-tunable via PUT /api/v1/assignment/config) ---
taskflow.assignment.skill-weight=0.5
taskflow.assignment.load-weight=0.3
taskflow.assignment.speed-weight=0.2
taskflow.assignment.min-skill-threshold=0.2
taskflow.assignment.prevent-self-assign=true
taskflow.assignment.neutral-speed-score=0.5
taskflow.assignment.default-max-avg-hours=80
taskflow.assignment.triage-retry-hours=24
taskflow.assignment.resolution-window-days=30
taskflow.assignment.nightly-cron=0 0 2 * * *

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
