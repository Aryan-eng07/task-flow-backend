# Datasource is supplied by @ServiceConnection (Testcontainers MySQL 8).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false

# Run the assignment listener inline-ish but still async; tests poll for the result.
taskflow.assignment.nightly-cron=0 0 5 31 2 ?

logging.level.com.example.task_flow_backend=INFO
